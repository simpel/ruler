name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Check architectures
        run: lipo -archs build/Ruler.app/Contents/MacOS/Ruler
