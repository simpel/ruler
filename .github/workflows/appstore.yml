name: Deploy to App Store Connect

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (auto, patch, minor, major, or explicit version e.g. 1.7.0)'
        required: false
        default: 'auto'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Upload to App Store Connect
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Latest Xcode Version
        run: |
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: Install Signing Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.INSTALLER_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "ruler-mas-ci-temp"
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 1. Import primary distribution certificate (.p12)
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # 2. Import optional separate installer certificate if provided
          if [ -n "$INSTALLER_CERTIFICATE_BASE64" ]; then
            INSTALLER_CERT_PATH="$RUNNER_TEMP/installer_certificate.p12"
            echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$INSTALLER_CERT_PATH"
            INST_PWD="${INSTALLER_P12_PASSWORD:-$P12_PASSWORD}"
            security import "$INSTALLER_CERT_PATH" -P "$INST_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Available code-signing identities in runner keychain:"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -f "Resources/Distanser_MAS.provisionprofile" ]; then
            echo "Using committed Resources/Distanser_MAS.provisionprofile..."
          elif [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Installing provisioning profile from BUILD_PROVISION_PROFILE_BASE64 secret..."
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "Resources/Distanser_MAS.provisionprofile"
          else
            echo "error: Resources/Distanser_MAS.provisionprofile not found" >&2
            exit 1
          fi

      - name: Set up App Store Connect API Key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 ~/.private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 ~/.private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Bump App Version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
        run: |
          # Guarantee build number is monotonically increasing beyond historical submissions (>7)
          BUILD_NUMBER=$(( 100 + ${{ github.run_number }} ))
          echo "Setting dynamic build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          # Automatically calculate next version and update Resources/Info.plist
          chmod +x Tools/bump-version.sh
          ./Tools/bump-version.sh --bump "$BUMP_INPUT" --build "$BUILD_NUMBER" --write

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "Determined app version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # If running on main, commit the version bump and push tag back to repo
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            if ! git diff --quiet Resources/Info.plist; then
              echo "Committing version bump to $VERSION (build $BUILD_NUMBER)..."
              git add Resources/Info.plist
              git commit -m "chore(release): bump version to $VERSION [skip ci]"
              if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
                git tag -a "v$VERSION" -m "Release v$VERSION"
              fi
              git pull --rebase origin main || true
              git push origin main --tags || echo "Warning: git push failed, continuing with build..."
            elif ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
              echo "Tagging existing version v$VERSION..."
              git tag -a "v$VERSION" -m "Release v$VERSION"
              git push origin "v$VERSION" || echo "Warning: git push tag failed, continuing with build..."
            fi
          fi

      - name: Build & Package for Mac App Store
        env:
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          APP_VERSION: ${{ env.VERSION }}
        run: |
          BUILD_NUMBER="$BUILD_NUMBER" APP_VERSION="$APP_VERSION" KEYCHAIN_PATH="$KEYCHAIN_PATH" ./package-appstore.sh

          PKG_PATH=$(ls build/dist/Distanser-*-appstore.pkg | head -n 1)
          echo "Discovered package: $PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Distanser-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}-appstore-pkg
          path: ${{ env.PKG_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Uploading $PKG_PATH to App Store Connect..."
          set +e
          UPLOAD_OUTPUT=$(xcrun altool --upload-package "$PKG_PATH" \
            --type macos \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" 2>&1)
          UPLOAD_STATUS=$?
          set -e
          echo "$UPLOAD_OUTPUT"

          if [ $UPLOAD_STATUS -ne 0 ] || echo "$UPLOAD_OUTPUT" | grep -E -qi "(Validation failed|Failed to upload package|STATE_ERROR)"; then
            echo "::error::Upload to App Store Connect failed!" >&2
            exit 1
          fi

      - name: Clean up temporary keychain and credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys ~/.private_keys 2>/dev/null || true
